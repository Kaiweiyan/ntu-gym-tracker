[project]
name = "ntu-gym-tracker"
version = "0.5.0"
description = "Collect, visualize, and (soon) forecast occupancy of NTU's gym and pool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.138.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.3",
    "tzdata>=2026.2",
    "uvicorn[standard]>=0.49.0",
]

# Command-line entry points, installed into .venv/bin by `uv sync`
# (run with `uv run <name>`). See docs/spec.md §1.1.
[project.scripts]
collector = "ntu_gym_tracker.collector:main"
daily-check = "ntu_gym_tracker.daily_check:main"
csv-tool = "ntu_gym_tracker.csv_tool:main"

# A build backend makes uv install the project itself (editable), which is
# what puts the [project.scripts] commands on the venv's PATH.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
