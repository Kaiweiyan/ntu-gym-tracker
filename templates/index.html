{% extends "base.html" %}

{% block content %}
<section>
  <h2>{{ t.now_heading }}</h2>
  <!-- HTMX: load the fragment now, then re-fetch every 60s and swap it in. -->
  <div hx-get="/partials/current" hx-trigger="load, every 60s">
    <p class="muted">{{ t.loading }}</p>
  </div>
</section>

<section>
  <h2>{{ t.venue_heading }}</h2>
  <div class="venue-select" id="venue-toggle">
    {% for v in venues %}
    <button data-venue="{{ v.id }}" data-y-max="{{ v.y_max or '' }}" class="{% if loop.first %}active{% endif %}">{{ v.name }}</button>
    {% endfor %}
  </div>
</section>

<section>
  <h2>{{ t.forecast_heading }}<span class="venue-tag"></span></h2>
  <div class="venue-toggle" id="forecast-day-toggle">
    <button data-day="today" class="active">{{ t.today }} <span class="day-date">{{ today_label }}</span></button>
    <button data-day="tomorrow">{{ t.tomorrow }} <span class="day-date">{{ tomorrow_label }}</span></button>
  </div>
  <div id="forecast" class="chart chart-tall"></div>
</section>

<section>
  <h2>{{ t.profile_heading }}<span class="venue-tag"></span></h2>
  <div class="venue-toggle" id="profile-toggle">
    <button data-days="1">{{ t.days_1 }}</button>
    <button data-days="3">{{ t.days_3 }}</button>
    <button data-days="7" class="active">{{ t.days_7 }}</button>
    <button data-days="30">{{ t.days_30 }}</button>
  </div>
  <div id="profile" class="chart chart-tall"></div>
</section>

<section>
  <h2>{{ t.calendar_heading }}</h2>
  <!-- HTMX: load this month's closures; the grid's own buttons change month. -->
  <div id="calendar" class="calendar" hx-get="/partials/calendar" hx-trigger="load">
    <p class="muted">{{ t.loading }}</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  // First venue is selected by default (falls back to "gym" if none yet).
  const firstBtn = document.querySelector("#venue-toggle button");
  let currentVenue = firstBtn ? firstBtn.dataset.venue : "gym";
  // Fixed y-axis ceiling per venue (config.CHART_Y_MAX, else its max
  // capacity), shared by the forecast and profile charts, so toggling
  // today/tomorrow or the day range never rescales the axis and equal heights
  // always mean equal head counts. Stretches past the ceiling only if a day's
  // data actually exceeds it, rather than clipping the curve.
  let currentYMax = firstBtn ? +firstBtn.dataset.yMax || null : null;
  const yAxisMax = () => currentYMax ? (v) => Math.max(currentYMax, v.max) : undefined;

  // Show the current venue name beside every venue-dependent chart heading, so
  // it's clear which venue each chart is displaying (the selector is one place).
  function setVenueTags(name) {
    document.querySelectorAll(".venue-tag").forEach(el => { el.textContent = "· " + name; });
  }

  // Chart labels in the page's language (see ntu_gym_tracker/i18n.py).
  const T = {{ t_js | tojson }};

  // ECharts bakes its theme in at init, so a theme switch means disposing and
  // re-creating the charts. Background stays transparent so the card's own
  // (CSS-themed) background shows through.
  let forecastChart, profileChart;
  function initCharts() {
    [forecastChart, profileChart].forEach(c => c && c.dispose());
    const theme = document.documentElement.dataset.theme === "dark" ? "dark" : null;
    forecastChart = echarts.init(document.getElementById("forecast"), theme);
    profileChart = echarts.init(document.getElementById("profile"), theme);
  }
  initCharts();

  let currentForecastDay = "today";

  async function loadForecast(venue, day) {
    const res = await fetch(`/api/forecast?venue=${venue}&day=${day}`);
    const d = await res.json();
    const nowIdx = d.now_slot ? d.slots.indexOf(d.now_slot) : -1;

    forecastChart.setOption({
      baseOption: {
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { data: [T.actual, T.forecast], top: 0, right: 8 },
        grid: { top: 35, left: 48, right: 20, bottom: 40 },
        xAxis: { type: "category", data: d.slots, axisLabel: { interval: (i, v) => v.endsWith(":00") } },
        yAxis: { type: "value", name: T.count_axis, nameTextStyle: { align: "left" }, min: 0, max: yAxisMax() },
        series: [
          {
            name: T.actual, type: "line", showSymbol: false, smooth: true,
            data: d.actual, connectNulls: false,
            lineStyle: { width: 2 }, areaStyle: { opacity: 0.12 },
            markLine: nowIdx >= 0 ? {
              silent: true, symbol: "none",
              lineStyle: { type: "dashed", color: "#888" },
              label: { formatter: T.now, position: "insideEndTop" },
              data: [{ xAxis: nowIdx }],
            } : undefined,
          },
          {
            name: T.forecast, type: "line", showSymbol: false, smooth: true,
            data: d.forecast, connectNulls: false,
            lineStyle: { type: "dashed", width: 2 },
          },
        ],
      },
      media: [{ query: { maxWidth: 600 }, option: {
        grid: { bottom: 55 },
        xAxis: { axisLabel: { rotate: 40, fontSize: 10, interval: (i, v) => v.endsWith(":00") && parseInt(v, 10) % 2 === 0 } },
      }}],
    }, true);
  }

  let currentProfileDays = 7;

  async function loadProfile(venue, days) {
    const res = await fetch(`/api/profile?venue=${venue}&days=${days}`);
    const d = await res.json();
    profileChart.setOption({
      baseOption: {
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        grid: { top: 35, left: 48, right: 20, bottom: 40 },
        xAxis: {
          type: "category",
          data: d.slots,
          // Label only on the hour (:00) so the axis isn't crowded with 10-min slots.
          axisLabel: { interval: (idx, val) => val.endsWith(":00") },
        },
        yAxis: { type: "value", name: T.avg_axis, nameTextStyle: { align: "left" }, min: 0, max: yAxisMax() },
        series: [{
          type: "line", showSymbol: false, smooth: true,
          data: d.counts,
          areaStyle: { opacity: 0.15 },
        }],
      },
      // Narrow screens: rotate, shrink, and thin to every 2 hours.
      media: [{ query: { maxWidth: 600 }, option: {
        grid: { bottom: 55 },
        xAxis: { axisLabel: {
          rotate: 40, fontSize: 10,
          interval: (idx, val) => val.endsWith(":00") && parseInt(val, 10) % 2 === 0,
        }},
      }}],
    }, true);
  }

  function refresh() {
    loadForecast(currentVenue, currentForecastDay);
    loadProfile(currentVenue, currentProfileDays);
  }

  // Generic single-select toggle: marks the clicked button active, runs `onPick`.
  function wireToggle(selector, onPick) {
    document.querySelectorAll(`${selector} button`).forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(`${selector} button`).forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        onPick(btn);
      });
    });
  }

  wireToggle("#venue-toggle", (btn) => {
    currentVenue = btn.dataset.venue;
    currentYMax = +btn.dataset.yMax || null;
    setVenueTags(btn.textContent.trim());
    refresh();
  });
  wireToggle("#profile-toggle", (btn) => {
    currentProfileDays = +btn.dataset.days;
    loadProfile(currentVenue, currentProfileDays);
  });
  wireToggle("#forecast-day-toggle", (btn) => {
    currentForecastDay = btn.dataset.day;
    loadForecast(currentVenue, currentForecastDay);
  });

  // Keep charts responsive to window resizing.
  window.addEventListener("resize", () => {
    forecastChart.resize(); profileChart.resize();
  });
  // Light/dark toggle (base.html): redraw the charts in the new theme.
  document.addEventListener("themechange", () => { initCharts(); refresh(); });

  setVenueTags(firstBtn ? firstBtn.textContent.trim() : "");
  refresh();
  // Keep charts current as time passes (the forecast's "now" line advances and
  // new readings arrive); the live cards already refresh via HTMX.
  setInterval(refresh, 5 * 60 * 1000);
</script>
{% endblock %}
