<!doctype html>
<html lang="{{ t.html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NTU Gym Tracker{% endblock %}</title>
  <!-- Apply the saved theme (or the system's) before first paint, so a dark
       page never flashes light. Theme is client-only, kept in localStorage. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark"
                       : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ static_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <!-- ECharts: draws the charts in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <!-- HTMX: lets HTML attributes fetch/refresh fragments without writing JS -->
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>NTU Gym Tracker</h1>
        <p class="sub">{{ t.subtitle }}</p>
      </div>
      <div class="prefs">
        <div class="pref-toggle" id="lang-toggle">
          <button data-lang="zh" class="{% if lang == 'zh' %}active{% endif %}">中文</button>
          <button data-lang="en" class="{% if lang == 'en' %}active{% endif %}">EN</button>
        </div>
        <div class="pref-toggle" id="theme-toggle">
          <button data-theme-choice="light" title="{{ t.light }}" aria-label="{{ t.light }}">☀️</button>
          <button data-theme-choice="dark" title="{{ t.dark }}" aria-label="{{ t.dark }}">🌙</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>{{ t.footer }}</p>
  </footer>
  <script>
    (function () {
      const root = document.documentElement;
      const markTheme = () => document.querySelectorAll("#theme-toggle button").forEach(
        b => b.classList.toggle("active", b.dataset.themeChoice === root.dataset.theme));

      // Theme: switch in place, remember it, and tell the charts to redraw.
      document.querySelectorAll("#theme-toggle button").forEach(b => b.addEventListener("click", () => {
        if (root.dataset.theme === b.dataset.themeChoice) return;
        root.dataset.theme = b.dataset.themeChoice;
        try { localStorage.setItem("theme", b.dataset.themeChoice); } catch (e) {}
        markTheme();
        document.dispatchEvent(new Event("themechange"));
      }));

      // Language: a cookie (the server renders the text), then reload.
      document.querySelectorAll("#lang-toggle button").forEach(b => b.addEventListener("click", () => {
        if (b.classList.contains("active")) return;
        document.cookie = `lang=${b.dataset.lang}; max-age=31536000; path=/; samesite=lax`;
        location.reload();
      }));

      markTheme();
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
